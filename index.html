<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tarique Ansari · BeingMuslims – The Hijab Shoppe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#1a2716;
  --bg-deep:#121c10;
  --gold:#d9b47a;
  --gold-soft:#a98657;
  --gold-light:#efc989;
  --ink:#f3e6cf;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Montserrat","Helvetica Neue",Arial,sans-serif;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:radial-gradient(120% 80% at 50% 0%,#233420 0%,var(--bg) 45%,var(--bg-deep) 100%);
  color:var(--ink);
  font-family:var(--sans);
  display:flex;justify-content:center;
}
.card{
  width:100%;max-width:440px;
  padding:48px 24px 40px;
  display:flex;flex-direction:column;align-items:center;
}
.mark{width:132px;height:auto;display:block}
.brand{
  font-family:var(--serif);font-weight:500;
  font-size:2rem;letter-spacing:.06em;margin:20px 0 0;
  background:linear-gradient(90deg,var(--gold-soft),var(--gold-light));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.tag{
  display:flex;align-items:center;gap:12px;width:100%;
  margin:6px 0 0;font-family:var(--serif);font-size:.78rem;letter-spacing:.32em;color:var(--gold-soft);
  text-transform:uppercase;
}
.tag::before,.tag::after{content:"";flex:1;height:1px;background:var(--gold-soft);opacity:.6}
.person{margin:40px 0 0;text-align:center}
.person h1{
  font-family:var(--serif);font-weight:600;font-size:2.1rem;margin:0;letter-spacing:.02em;color:var(--gold-light);
}
.person p{margin:4px 0 0;font-size:.85rem;letter-spacing:.06em;color:var(--ink);opacity:.85}
.band{
  width:100%;height:3px;margin:28px 0;border:0;
  background:linear-gradient(90deg,var(--gold-soft),var(--gold-light));
}
.links{list-style:none;margin:0;padding:0;width:100%;display:grid;gap:12px}
.links a{
  display:flex;align-items:center;gap:16px;
  min-height:64px;padding:12px 16px;
  color:var(--ink);text-decoration:none;
  border:1px solid rgba(217,180,122,.35);border-radius:14px 30px 14px 30px;
  background:rgba(255,255,255,.03);
  transition:background .2s,border-color .2s;
}
.links a:hover{background:rgba(217,180,122,.12);border-color:var(--gold)}
.links a:focus-visible{outline:2px solid var(--gold-light);outline-offset:3px}
.ico{
  flex:none;width:44px;height:44px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--gold-soft),var(--gold-light));
  color:var(--bg-deep);
  clip-path:polygon(12% 0,100% 0,100% 100%,0 100%,0 22%);
  border-radius:0;
}
.ico svg{width:22px;height:22px}
.txt{display:flex;flex-direction:column;min-width:0;line-height:1.35}
.txt small{font-size:.72rem;color:var(--gold-soft);letter-spacing:.04em}
.txt span{font-size:.98rem;overflow-wrap:anywhere}
.addr span{font-size:.9rem}
@media (prefers-color-scheme:light){
  /* brand page stays dark green regardless of viewer theme */
}
</style>
</head>
<body>

  <h2 class="brand">BEINGMUSLIMS</h2>
  <div class="tag">The Hijab Shoppe</div>

  <div class="person">

  </div>

  <hr class="band">

        </span>
        <span class="txt"><small>Email</small><span>tariqdeena@gmail.com</span></span>

        <span class="ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
        </span>
        <span class="txt"><small>Visit us</small><span>9th Plot – CS No 1492, C-901 Floor, Green Stone Heritage, Ramabai Ambedkar Marg, Crawford, Mumbai – 400001</span></span>
      </a>

  </ul>

</main>
</body>
</html>
